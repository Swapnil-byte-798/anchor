# =============================================================================
# ANCHOR — default configuration.
#
# This file is a complete, commented mirror of the pydantic defaults in
# src/anchor/settings.py: every knob in the system is on this one screen.
#
# PRECEDENCE (highest first):
#     init kwargs  >  environment variables  >  .env  >  THIS FILE  >  defaults
#
# Environment variables use the ANCHOR_ prefix and a DOUBLE UNDERSCORE for
# nesting, so anything here can be overridden without editing the file:
#     ANCHOR_LLM__PROVIDER=openai
#     ANCHOR_LLM__API_KEY=sk-...
#     ANCHOR_CHUNKING__CHUNK_TOKENS=256
#     ANCHOR_RETRIEVAL__MODE=bm25
#     ANCHOR_EMBEDDING__DIM=512
# Point at a different file with ANCHOR_CONFIG_FILE=config/whatever.yaml.
#
# NO API KEYS LIVE IN THIS FILE. Secrets come from the environment only. The
# defaults below are zero-key and zero-network: a hashing embedder, an
# extractive stub LLM and a heuristic judge. Nothing is ever downloaded.
#
# NOT TO BE CONFUSED WITH eval/thresholds.yaml — that file is GENERATED from a
# real run by `make thresholds` (observed metric minus eval.threshold_slack) and
# must never be hand-edited. This file is hand-maintained; that one is not.
# =============================================================================

app_name: anchor
host: 0.0.0.0
port: 8000
# Seed for the hashing embedder and anything else that needs determinism.
# Every run of the eval harness is byte-reproducible because of this.
seed: 1337

# -----------------------------------------------------------------------------
# paths — all relative to the working directory (repo root; /app in the image).
# -----------------------------------------------------------------------------
paths:
  data_dir: data
  corpus_dir: corpus
  db_path: data/index.db # SQLite: documents, chunks and the FTS5 BM25 index
  vectors_path: data/vectors.npy # float32 (n, dim) matrix, L2-normalised
  reports_dir: eval/reports # ablation.md / failures.md / judge.md land here
  golden_path: eval/golden/qa.jsonl # 43 cases, regenerated by `make golden`
  authored_seed_path: eval/golden/authored_seed.jsonl # the 9 hand-written cases
  human_labels_path: eval/golden/human_labels.jsonl # 30 frozen judge triples
  thresholds_path: eval/thresholds.yaml # GENERATED — see `make thresholds`
  metrics_csv: corpus/metrics.csv # the lookup_metric tool's data source
  readme_path: README.md # `make readme` rewrites the table in place
  # doc_ids under corpus_dir that are ABOUT the corpus rather than part of it.
  # scripts/build_golden.py has always skipped these when generating questions;
  # ingest skips them too, so the SERVED corpus and the EVALUATED corpus are the
  # same six documents. Without this, corpus/README.md was retrievable as a
  # seventh document no golden case had ever heard of.
  corpus_exclude: [readme]

# -----------------------------------------------------------------------------
# chunking — the other half of the ablation grid. Gold labels are verbatim
# answer SPANS resolved to chunks at eval time, so changing these numbers can
# never invalidate a label; that is what makes the chunking sweep meaningful.
# -----------------------------------------------------------------------------
chunking:
  chunk_tokens: 512 # target chunk size, in count_tokens() units
  chunk_overlap: 64 # tokens repeated between adjacent chunks
  min_chunk_tokens: 80 # shorter tails are merged into the previous chunk

# -----------------------------------------------------------------------------
# retrieval — mode is one of: bm25 | dense | hybrid | hybrid_rerank
#   bm25          SQLite FTS5 only (the DECLARED BASELINE of the ablation)
#   dense         hashing-embedder cosine only
#   hybrid        reciprocal rank fusion of both legs, then MMR
#   hybrid_rerank hybrid plus a lexical rerank of the fused list
# -----------------------------------------------------------------------------
retrieval:
  mode: hybrid
  k_lexical: 30 # candidates pulled from the BM25 leg
  k_dense: 30 # candidates pulled from the dense leg
  rrf_k: 60 # the k constant in 1/(k + rank)
  use_mmr: true # diversify the fused list before packing
  mmr_lambda: 0.7 # 1.0 = pure relevance, 0.0 = pure diversity
  top_k: 5 # blocks offered to the packer
  context_token_budget: 1400 # hard cap on the packed context
  neighbour_window: 0 # 1 would also pack each hit's adjacent chunks
  max_candidates_recorded: 20 # cap on Trace.candidates, for response size

# -----------------------------------------------------------------------------
# gate — the scale-free abstain gate. ONE feature: the max lexical overlap
# between the question and any of the top-5 chunks. It is a ratio over the
# query's own tokens and never touches a retriever score, so one threshold is
# valid for bm25, dense and hybrid alike and the ablation rows stay comparable.
#
# There used to be a second feature here, `min_top_share` — the top-1 share of
# the top-5 score mass. It was removed because it was measurably inert: under
# RRF the top-5 scores are 1/(60+1)..1/(60+5), which are near-equal BY
# CONSTRUCTION, so top_share sat at ~0.205 for dense and hybrid and carried no
# information at all; over all 43 golden cases in all four modes the branch
# fired zero times. Shipping a gate feature that has never once made a decision
# is decoration, and the claim that it made the modes comparable was unsupported.
# `top_share` is still recorded on every GateDecision for debugging.
#
# This number is an operating point, not a truth: report.py prints a
# refusal-threshold SWEEP so the whole curve is visible.
# -----------------------------------------------------------------------------
gate:
  enabled: true
  min_lexical_overlap: 0.34

# -----------------------------------------------------------------------------
# grounding — per-sentence verification of the answer against the block it
# cites, and the ratio bands that turn that into an AnswerType.
# -----------------------------------------------------------------------------
grounding:
  support_threshold: 0.45 # a sentence is "supported" at or above this overlap
  grounded_ratio: 0.85 # supported/total at or above this => grounded
  partial_ratio: 0.60 # ... at or above this => partial, else refused

# -----------------------------------------------------------------------------
# judge — heuristic (offline default) or llm (only when a key is configured).
# Whichever is selected is scored against 30 frozen human labels by
# `make judge-check`. An unvalidated judge is not evidence.
# -----------------------------------------------------------------------------
judge:
  provider: heuristic
  grounded_threshold: 0.80
  partial_threshold: 0.50

# -----------------------------------------------------------------------------
# agent — the bounded tool loop behind POST /v1/agent. Every budget below is
# enforced; exhausting one returns a typed result, never a hang.
# -----------------------------------------------------------------------------
agent:
  planner: rules # deterministic by default; llm needs a key
  max_steps: 4
  tool_timeout_s: 10.0
  wall_clock_budget_s: 30.0
  max_total_tokens: 8000
  tools:
    - search_docs
    - calculator
    - lookup_metric
    - final_answer

# -----------------------------------------------------------------------------
# llm — provider: stub | openai | azure_openai | anthropic | bedrock
# The default `stub` is a genuinely extractive local model: it selects and cites
# sentences from the packed context. Requesting a real provider without its key
# raises ProviderNotConfigured naming the env var — never a silent fallback.
# Set the key via ANCHOR_LLM__API_KEY; it is never written to this file.
# -----------------------------------------------------------------------------
llm:
  provider: stub
  model: gpt-4o-mini
  api_key: null # ALWAYS null here — use ANCHOR_LLM__API_KEY
  base_url: null # override for an OpenAI-compatible gateway
  azure_endpoint: null # https://<resource>.openai.azure.com
  azure_deployment: null
  azure_api_version: "2024-06-01"
  aws_region: us-east-1
  temperature: 0.0 # 0.0 everywhere: reproducibility is a feature
  max_tokens: 700
  timeout_s: 30.0
  max_retries: 2
  price_per_1k_input_usd: 0.0 # set these to have Usage.cost_usd populated
  price_per_1k_output_usd: 0.0

# -----------------------------------------------------------------------------
# embedding — provider: hashing | openai | azure_openai | bedrock
# `hashing` is a deterministic, dependency-free, numpy-only embedder: signed
# token hashing into `dim` buckets, then L2 normalisation. No download, ever.
# Changing provider or dim invalidates data/vectors.npy; build_context raises
# IndexMismatchError telling you to re-run `anchor ingest --force`.
# -----------------------------------------------------------------------------
embedding:
  provider: hashing
  model: text-embedding-3-small # only consulted for the remote providers
  dim: 256
  api_key: null # ALWAYS null here — use ANCHOR_EMBEDDING__API_KEY
  base_url: null
  azure_endpoint: null
  azure_deployment: null
  azure_api_version: "2024-06-01"
  aws_region: us-east-1
  batch_size: 64
  timeout_s: 30.0
  max_retries: 2

# -----------------------------------------------------------------------------
# eval — the measurement layer's own configuration.
# -----------------------------------------------------------------------------
eval:
  worst_n: 12 # cases the failure taxonomy inspects and classifies
  threshold_slack: 0.05 # `make thresholds` writes (observed - slack) as floor
  max_question_chars: 2000 # input policy limit; longer => PolicyViolation
  # The ablation grid: 4 modes x 6 chunk configs = 24 rows, retrieval only.
  #
  # The sizes are DELIBERATELY far below the shipped 512/64, and they were
  # chosen by measurement rather than by taste.
  #
  # This grid used to sweep 256/512/1024 tokens. On this corpus that was
  # vacuous: a chunk never crosses a section boundary and the largest section
  # is 161 tokens, so 512/0, 512/64, 1024/0 and 1024/128 all produced a
  # byte-identical index — four of the six blocks were the SAME experiment
  # printed four times, and the generated line "chunking moved recall@5 by at
  # most 0.015" was a tautology rather than a finding.
  #
  # Above ~161 tokens nothing splits at all, and below `chunking.
  # min_chunk_tokens` (80) nothing splits either, so the only band this corpus
  # can resolve is roughly 96-144 tokens WITH overlap. The six pairs below were
  # verified to produce six distinct indexes. `run_ablation` fingerprints every
  # ingested index (sha256 of its sorted chunk ids) and prints a loud banner in
  # ablation.md when two configs collide, so a vacuous grid can never again be
  # presented as six data points. If you want a real chunk-size sweep, the fix
  # is a corpus with longer sections, not a wider grid.
  ablation_modes: [bm25, dense, hybrid, hybrid_rerank]
  ablation_chunk_configs:
    - [96, 0]
    - [96, 24]
    - [96, 40]
    - [112, 24]
    - [128, 24]
    - [144, 24]
  # Operating points for the refusal-threshold sweep table in the eval report:
  # the gate's lexical-overlap threshold is shown as a curve, not asserted.
  refusal_sweep_points: [0.10, 0.20, 0.30, 0.34, 0.40, 0.50, 0.60]

# -----------------------------------------------------------------------------
# obs — structured logging and the in-process counters behind GET /metrics.
# -----------------------------------------------------------------------------
obs:
  log_level: INFO
  log_json: true # false gives human-readable lines for local debugging
  max_body_bytes: 65536
