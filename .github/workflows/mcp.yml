name: optional MCP

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional adapter
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Typecheck with SDK
        run: mypy src
      - name: Test existing code and MCP integration
        run: python -m pytest
